name: Release

# Pushing a version tag such as v1.0.0 builds the installer and the portable
# zip and attaches them to a draft release. Running it by hand from the
# Actions tab makes the same build without a release, for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag and the changelog
        if: github.event_name == 'push'
        run: |
          $version = python -I -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
          }
          $changelog = Get-Content -Raw -Encoding utf8 CHANGELOG.md
          $section = [regex]::Match($changelog, "(?ms)^## \[?$([regex]::Escape($version))\]?(?:[ \t\r][^\n]*)?\n(.*?)(?=^## |\z)")
          if (-not $section.Success) {
            throw "CHANGELOG.md has no section for $version."
          }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $section.Groups[1].Value.Trim())
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create the virtual environment
        run: python -m venv .venv

      - name: Install
        run: .venv\Scripts\python -m pip install -e ".[dev]"

      - name: Test
        run: .venv\Scripts\python -m pytest -q

      # build.ps1 is written for Windows PowerShell 5.1, as it runs locally.
      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Upload the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: PDF-Compressor
          path: |
            dist/*.exe
            dist/*.zip

      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag
          --title "PDF Compressor ${env:VERSION}"
          --notes-file "$env:RUNNER_TEMP\notes.md"
          "dist\PDF-Compressor-Setup-${env:VERSION}.exe"
          "dist\PDF-Compressor-${env:VERSION}-portable.zip"
